<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fitness Tracker tests</title>
  <style>body { font: 15px/1.5 monospace; margin: 16px; } .fail { color: #b3261e; } .pass { color: #127a5b; }</style>
</head>
<body>
  <h1 id="summary">Running…</h1>
  <ul id="results"></ul>
  <script src="../lib/dexie.min.js"></script>
  <script src="../js/nutrition.js"></script>
  <script src="../js/foodApi.js"></script>
  <script src="../js/exercises.js"></script>
  <script src="../js/workout.js"></script>
  <script>
    // Uses a throwaway database name so tests never touch real data.
    const realDexie = Dexie;
    Dexie = class extends realDexie { constructor() { super('fitness-tracker-tests'); } };
  </script>
  <script src="../js/db.js"></script>
  <script>
    const outcomes = [];
    function near(a, b, tolerance = 0.01) { return Math.abs(a - b) <= tolerance; }
    function check(name, passed) { outcomes.push({ name, passed: !!passed }); }

    // --- Dates ---
    check('localDate uses local calendar day', localDate(new Date(2026, 10, 1, 23, 59)) === '2026-11-01');
    check('addDays crosses month end', addDays('2026-11-30', 1) === '2026-12-01');
    check('addDays crosses year end', addDays('2026-01-01', -1) === '2025-12-31');
    check('addDays handles the clock-change weekend', addDays('2026-11-01', 1) === '2026-11-02');

    // --- Unit conversion ---
    check('feet and inches to cm', near(feetInchesToCm(5, 10), 177.8));
    check('cm back to feet and inches', cmToFeetInches(177.8).feet === 5 && cmToFeetInches(177.8).inches === 10);
    check('inches never round to 12', cmToFeetInches(182.6).inches < 12);
    check('lb to kg', near(lbToKg(220.462), 100));

    // --- Target suggestions ---
    const person = { sex: 'male', kg: 90, cm: 180, age: 30, activity: 'moderate', pace: 'moderate' };
    check('resting calories match Mifflin-St Jeor', near(restingCalories(person), 900 + 1125 - 150 + 5));
    const suggested = suggestTargets(person);
    check('maintenance is resting × activity', suggested.maintenance === 2910);
    check('20% deficit', suggested.kcal === 2330);
    check('protein is 1.8 g/kg rounded to 5', suggested.protein === 160);
    check('fat is about 25% of calories', suggested.fat === 65);
    check('macros add up to the calories', Math.abs(macroCalories(suggested) - suggested.kcal) <= 4);
    const small = suggestTargets({ sex: 'female', kg: 45, cm: 150, age: 60, activity: 'low', pace: 'faster' });
    check('suggestion never goes below the floor', small.kcal === 1200 && small.raisedToFloor);
    const large = suggestTargets({ sex: 'male', kg: 200, cm: 180, age: 30, activity: 'low', pace: 'moderate' });
    check('protein is capped at 40% of calories', large.protein * 4 <= large.kcal * 0.4 + 10);
    check('carbs are never negative', large.carbs >= 0 && small.carbs >= 0);

    // --- USDA ---
    const usdaGeneral = normalizeUsdaFood({
      fdcId: 1, description: 'Chicken breast, rotisserie', dataType: 'Survey (FNDDS)',
      foodNutrients: [{ nutrientId: 1003, value: 28 }, { nutrientId: 1004, value: 3.5 }, { nutrientId: 1005, value: 0 }, { nutrientId: 1008, value: 144 }],
      foodMeasures: [{ disseminationText: '1 oz, cooked', gramWeight: 28.35 }, { disseminationText: 'Quantity not specified', gramWeight: 120 }],
    });
    check('USDA calories read', usdaGeneral.nutrients.kcal === 144);
    check('USDA measure becomes a portion', usdaGeneral.portions[0].label === '1 oz, cooked (28.4 g)' && near(usdaGeneral.portions[0].factor, 0.2835));
    check('"Quantity not specified" is skipped', !usdaGeneral.portions.some((p) => p.label.includes('Quantity')));
    check('zero carbs stays 0 and is not "missing"', usdaGeneral.nutrients.carbs === 0 && !usdaGeneral.nutrients.macrosMissing);
    const usdaAtwater = normalizeUsdaFood({
      fdcId: 2, description: 'Lunchmeat', foodNutrients: [{ nutrientId: 1003, value: 16 }, { nutrientId: 1004, value: 2 }, { nutrientId: 1005, value: 3 }, { nutrientId: 2047, value: 100 }],
    });
    check('USDA Atwater calories are used when needed', usdaAtwater.nutrients.kcal === 100);
    const usdaBranded = normalizeUsdaFood({
      fdcId: 3, description: 'GREEK YOGURT', brandName: 'OCEAN SPRAY', servingSize: 30, servingSizeUnit: 'g', householdServingFullText: '2 Tbsp',
      foodNutrients: [{ nutrientId: 1003, value: 3 }, { nutrientId: 1004, value: 20 }, { nutrientId: 1005, value: 70 }, { nutrientId: 1008, value: 467 }],
    });
    check('all-caps names are tidied', usdaBranded.name === 'Greek Yogurt' && usdaBranded.brand === 'Ocean Spray');
    check('branded serving is first', usdaBranded.portions[0].label === '2 Tbsp (30 g)' && near(usdaBranded.portions[0].factor, 0.3));
    const usdaDrink = normalizeUsdaFood({
      fdcId: 4, description: 'Milk', servingSize: 240, servingSizeUnit: 'MLT',
      foodNutrients: [{ nutrientId: 1003, value: 3 }, { nutrientId: 1004, value: 1 }, { nutrientId: 1005, value: 5 }, { nutrientId: 1008, value: 42 }],
    });
    check('drinks use ml', usdaDrink.portions.some((p) => p.label === '100 ml') && !usdaDrink.portions.some((p) => p.label === '100 g'));
    check('USDA food without nutrition is dropped', normalizeUsdaFood({ fdcId: 5, description: 'Empty', foodNutrients: [] }) === null);

    // --- Open Food Facts ---
    const offFood = normalizeOffProduct({
      code: '20047559', product_name: 'Yogurt', brands: 'Pilos, Lidl', serving_size: '100 gram', serving_quantity: 100,
      nutriments: { 'energy-kcal_100g': 96, proteins_100g: 4.6, carbohydrates_100g: 3.2, fat_100g: 10 },
    });
    check('OFF first brand used', offFood.brand === 'Pilos');
    check('OFF nutrients read', offFood.nutrients.kcal === 96 && offFood.nutrients.fat === 10);
    const offKj = normalizeOffProduct({ code: '1', product_name: 'X', nutriments: { energy_100g: 418.4, proteins_100g: 1, carbohydrates_100g: 1, fat_100g: 1 } });
    check('OFF converts kJ when kcal is missing', near(offKj.nutrients.kcal, 100));
    const offBad = normalizeOffProduct({ code: '2', product_name: 'Bad', nutriments: { 'energy-kcal_100g': 5000 } });
    check('impossible calorie values are dropped', offBad === null);
    const offPartial = normalizeOffProduct({ code: '3', product_name: 'Partial', nutriments: { 'energy-kcal_100g': 200, proteins_100g: 5 } });
    check('missing macros are flagged', offPartial.nutrients.macrosMissing === true && offPartial.nutrients.fat === 0);
    check('OFF product without a name is dropped', normalizeOffProduct({ code: '4', nutriments: { 'energy-kcal_100g': 100 } }) === null);

    // --- Totals ---
    const entry = { qty: 2, portionIndex: 0, food: { nutrients: { kcal: 100, protein: 10, carbs: 5, fat: 2 }, portions: [{ label: '100 g', factor: 1.5 }] } };
    check('entry totals scale by portion and amount', entryTotals(entry).kcal === 300 && entryTotals(entry).protein === 30);
    check('summing an empty day gives 0', sumEntries([]).kcal === 0);

    // --- Starter program ---
    const workoutIds = (w) => w.exercises.map((x) => x.exerciseId).join();
    check('Workout A matches the plan', workoutIds(STARTER_WORKOUTS[0]) === 'goblet-squat,db-bench,one-arm-row,db-rdl');
    check('Workout B matches the plan', workoutIds(STARTER_WORKOUTS[1]) === 'barbell-rdl,db-ohp,lat-pulldown,db-split-squat');
    check('every program exercise exists', STARTER_WORKOUTS.every((w) => w.exercises.every((x) => EXERCISES.some((e) => e.id === x.exerciseId))));
    check('exercise ids are unique', new Set(EXERCISES.map((e) => e.id)).size === EXERCISES.length);
    check('every built-in has 1 or 2 cues', EXERCISES.every((e) => e.cues.length >= 1 && e.cues.length <= 2));

    // --- Schedule. 2026-11-02 is a Monday. ---
    const weekOf = (monday, schedule) => weekDates(monday).map((d) => {
      const i = rotationIndex(d.date, schedule, 2);
      return i === null ? '-' : 'AB'[i];
    }).join('');
    const threeDays = makeSchedule([0, 2, 4], '2026-11-01');
    check('Sunday setup makes Monday the first day', threeDays.anchor === '2026-11-02');
    check('week 1 is A/B/A', weekOf('2026-11-02', threeDays) === 'A-B-A--');
    check('week 2 is B/A/B', weekOf('2026-11-09', threeDays) === 'B-A-B--');
    check('week 3 is A/B/A again', weekOf('2026-11-16', threeDays) === 'A-B-A--');
    check('earlier weeks work without errors', weekOf('2026-10-26', threeDays) === 'B-A-B--');
    const midWeek = makeSchedule([0, 2, 4], '2026-11-03');
    check('joining midweek starts on the next day with A', midWeek.anchor === '2026-11-04' && rotationIndex('2026-11-04', midWeek, 2) === 0);
    const twoDays = makeSchedule([3, 0], '2026-11-01');
    check('2 days a week alternates', weekOf('2026-11-02', twoDays) === 'A--B---' && weekOf('2026-11-09', twoDays) === 'A--B---');
    check('startIndex shifts the rotation', rotationIndex('2026-11-02', makeSchedule([0, 2, 4], '2026-11-01', 1), 2) === 1);
    check('schedule survives the clock change', rotationIndex('2026-03-09', makeSchedule([0, 2, 4], '2026-03-02'), 2) === 1);

    // --- Progression ---
    const plan = { sets: 3, repMin: 8, repMax: 10 };
    const sets = (weight, ...reps) => reps.map((r) => ({ weight, reps: r }));
    const up = progressionAdvice(sets(35, 10, 10, 10), plan, 'dumbbell', 'lb');
    check('top of range on every set means go up', up.status === 'up' && up.suggestedWeight === 40);
    check('dumbbell prompt says next size', up.message.includes('next dumbbell size'));
    check('barbell goes up 5 lb', progressionAdvice(sets(95, 10, 10, 10), plan, 'barbell', 'lb').suggestedWeight === 100);
    check('barbell press goes up 2.5 lb', progressionAdvice(sets(95, 10, 10, 10), plan, 'barbellPress', 'lb').suggestedWeight === 97.5);
    check('kg steps are used in kg', progressionAdvice(sets(20, 10, 10, 10), plan, 'dumbbell', 'kg').suggestedWeight === 22);
    check('one set short of the top means build', progressionAdvice(sets(35, 10, 10, 9), plan, 'dumbbell', 'lb').status === 'build');
    check('below the range means stay', progressionAdvice(sets(35, 10, 8, 7), plan, 'dumbbell', 'lb').status === 'stay');
    check('skipped sets do not count as ready', progressionAdvice(sets(35, 10, 10), plan, 'dumbbell', 'lb').status === 'build');
    check('mixed weights do not count as ready', progressionAdvice([...sets(35, 10, 10), ...sets(30, 10)], plan, 'dumbbell', 'lb').status === 'build');
    check('no history means no advice', progressionAdvice([], plan, 'dumbbell', 'lb') === null);
    check('bodyweight suggests no weight', progressionAdvice(sets('', 10, 10, 10), plan, 'bodyweight', 'lb').suggestedWeight === undefined);

    // --- Previous sets and building a session ---
    const doneSet = (weight, reps) => ({ weight, reps, rpe: '', done: true });
    const history = [
      { status: 'done', date: '2026-11-02', startedAt: 1, unit: 'lb', items: [{ exerciseId: 'db-bench', kind: 'dumbbell', sets: [doneSet(30, 10)] }] },
      { status: 'done', date: '2026-11-04', startedAt: 2, unit: 'lb', items: [{ exerciseId: 'db-bench', kind: 'dumbbell', sets: [doneSet(35, 9), { weight: 35, reps: '', rpe: '', done: false }] }] },
      { status: 'active', date: '2026-11-06', startedAt: 3, unit: 'lb', items: [{ exerciseId: 'db-bench', kind: 'dumbbell', sets: [doneSet(99, 9)] }] },
    ];
    const previous = findPreviousSets('db-bench', history, 'lb');
    check('uses the most recent finished session', previous.date === '2026-11-04' && previous.sets[0].weight === 35);
    check('unticked sets are ignored', previous.sets.length === 1);
    check('exercises never done give nothing', findPreviousSets('plank', history, 'lb') === null);
    check('previous weights convert units', findPreviousSets('db-bench', history, 'kg').sets[0].weight === 16);
    const bench = EXERCISES.find((e) => e.id === 'db-bench');
    const row = { sets: 3, repMin: 6, repMax: 10, restSec: 120 };
    const firstTime = buildSessionItem(bench, row, null, 'lb');
    check('first time starts empty', firstTime.sets.length === 3 && firstTime.sets[0].weight === '' && firstTime.advice === null);
    const again = buildSessionItem(bench, row, { date: '2026-11-04', sets: sets(35, 9, 8, 8) }, 'lb');
    check('weight fills in from last time', again.sets.every((s) => s.weight === 35) && again.sets[0].reps === '');
    const ready = buildSessionItem(bench, row, { date: '2026-11-04', sets: sets(35, 10, 10, 10) }, 'lb');
    check('going up fills in the new weight', ready.sets.every((s) => s.weight === 40));
    check('logged sets need reps', !isLoggedSet({ done: true, reps: '', weight: 30 }, 'dumbbell'));
    check('logged sets need ticking', !isLoggedSet({ done: false, reps: 5, weight: 30 }, 'dumbbell'));
    check('bodyweight sets need no weight', isLoggedSet({ done: true, reps: 5, weight: '' }, 'bodyweight'));
    check('previous sets read clearly', formatPreviousSets(sets(35, 10, 9), 'lb', 'dumbbell') === '35 lb × 10, 9');
    check('rest time format', formatRestTime(90) === '1:30' && formatRestTime(0.2) === '0:01' && formatRestTime(-5) === '0:00');

    // --- Backup and restore ---
    (async () => {
      // --- Search retries, using a stand-in for the network ---
      const realFetch = window.fetch;
      const fakeFetch = (replies) => {
        const calls = { count: 0 };
        window.fetch = async () => {
          const reply = replies[Math.min(calls.count, replies.length - 1)];
          calls.count += 1;
          if (reply === 'network') throw new TypeError('Failed to fetch');
          return { ok: reply === 200, status: reply, json: async () => ({ fine: true }) };
        };
        return calls;
      };
      let calls = fakeFetch([400, 200]);
      check('a one-off error is retried', (await fetchJson('x')).fine && calls.count === 2);
      calls = fakeFetch(['network', 200]);
      check('a one-off network failure is retried', (await fetchJson('x')).fine && calls.count === 2);
      calls = fakeFetch([429, 200]);
      let limitError = null;
      await fetchJson('x').catch((e) => { limitError = e; });
      check('a reached limit is not retried', limitError && limitError.status === 429 && calls.count === 1);
      calls = fakeFetch([500]);
      let lastError = null;
      await fetchJson('x').catch((e) => { lastError = e; });
      check('it stops after one retry', lastError && calls.count === 2);
      window.fetch = realFetch;

      await db.delete();
      await db.open();
      const food = { key: 'custom:a', source: 'custom', name: 'Oats', brand: '', nutrients: { kcal: 150, protein: 5, carbs: 27, fat: 3 }, portions: [{ label: '1 bowl', factor: 1 }], lastUsed: 1 };
      await db.foods.put(food);
      await db.entries.add({ date: '2026-11-01', meal: 'breakfast', foodKey: 'custom:a', qty: 1, portionIndex: 0, food, createdAt: 1 });
      await db.targets.put({ startDate: '2026-10-01', kcal: 2000, protein: 150, carbs: 200, fat: 60 });
      await db.targets.put({ startDate: '2026-11-01', kcal: 1900, protein: 150, carbs: 180, fat: 60 });
      await setSetting('units', 'kg');
      await setSetting('usdaKey', 'SECRET');

      check('target lookup finds the latest before the day', (await targetsForDate('2026-10-20')).kcal === 2000);
      check('target lookup on the change day', (await targetsForDate('2026-11-01')).kcal === 1900);
      check('days before first targets use the first', (await targetsForDate('2026-01-01')).kcal === 2000);

      const backup = JSON.parse(JSON.stringify(await createBackup()));
      check('USDA key is left out of backups', !JSON.stringify(backup).includes('SECRET'));
      check('backup validates', validateBackup(backup).entries === 1);

      await db.entries.clear();
      await db.foods.clear();
      await setSetting('units', 'lb');
      await restoreBackup(backup);
      const restored = await db.entries.toArray();
      check('entries come back after restore', restored.length === 1 && restored[0].food.name === 'Oats');
      check('settings come back after restore', (await getSetting('units')) === 'kg');
      check('USDA key on the phone survives a restore', (await getSetting('usdaKey')) === 'SECRET');

      const throws = (value) => { try { validateBackup(value); return false; } catch { return true; } };
      check('other files are rejected', throws({ hello: 'world' }));
      check('newer backups are rejected', throws({ ...backup, schemaVersion: 99 }));
      const damaged = JSON.parse(JSON.stringify(backup));
      damaged.data.entries[0].qty = -1;
      check('damaged backups are rejected', throws(damaged));
      let refused = false;
      try { await restoreBackup(damaged); } catch { refused = true; }
      check('a damaged restore changes nothing', refused && (await db.entries.count()) === 1);

      // --- Workout data in backups ---
      await ensureProgram();
      check('starter program is added once', (await db.workouts.count()) === 2);
      await db.workouts.update('A', { name: 'Edited A' });
      await ensureProgram();
      check('your program edits are not overwritten', (await db.workouts.get('A')).name === 'Edited A');
      await db.sessions.add({ date: '2026-11-02', status: 'done', unit: 'lb', startedAt: 1, workoutId: 'A', workoutName: 'Workout A', items: [{ exerciseId: 'db-bench', name: 'Bench', kind: 'dumbbell', sets: [{ weight: 30, reps: 10, rpe: '8', done: true }] }] });
      await db.cardio.add({ date: '2026-11-03', type: 'Walk', minutes: 30, distance: null, distanceUnit: 'mi', createdAt: 1 });
      await db.exercises.put({ id: 'custom-1', name: 'My lift', kind: 'machine', group: 'Your exercises', cues: [] });
      const fullBackup = JSON.parse(JSON.stringify(await createBackup()));
      check('backups include workouts', fullBackup.data.sessions.length === 1 && fullBackup.data.cardio.length === 1 && fullBackup.data.exercises.length === 1);
      await Promise.all([db.sessions.clear(), db.cardio.clear(), db.exercises.clear(), db.workouts.clear()]);
      await restoreBackup(fullBackup);
      check('workouts come back after restore', (await db.sessions.toArray())[0].items[0].sets[0].reps === 10);
      check('cardio and custom exercises come back', (await db.cardio.count()) === 1 && (await db.exercises.count()) === 1);
      check('edited program comes back', (await db.workouts.get('A')).name === 'Edited A');

      const stage1Backup = JSON.parse(JSON.stringify(fullBackup));
      stage1Backup.schemaVersion = 1;
      ['exercises', 'workouts', 'sessions', 'cardio'].forEach((table) => { delete stage1Backup.data[table]; });
      stage1Backup.data.settings = stage1Backup.data.settings.filter((s) => s.key !== 'schedule');
      check('Stage 1 backups are still accepted', validateBackup(stage1Backup).sessions === 0);
      await restoreBackup(stage1Backup);
      check('food data comes back from a Stage 1 backup', (await db.entries.count()) === 1);
      await ensureProgram();
      check('program is added after a Stage 1 restore', (await db.workouts.count()) === 2 && !!(await getSetting('schedule')));

      const badSession = JSON.parse(JSON.stringify(fullBackup));
      badSession.data.sessions[0].items = 'nope';
      check('damaged workouts are rejected', throws(badSession));

      await db.delete();
      render();
    })().catch((error) => { check(`test crash: ${error.message}`, false); render(); });

    function render() {
      const failed = outcomes.filter((o) => !o.passed).length;
      document.getElementById('summary').textContent = `${outcomes.length - failed} passed, ${failed} failed`;
      document.getElementById('summary').className = failed ? 'fail' : 'pass';
      document.getElementById('results').innerHTML = outcomes
        .map((o) => `<li class="${o.passed ? 'pass' : 'fail'}">${o.passed ? 'PASS' : 'FAIL'}: ${o.name}</li>`)
        .join('');
    }
  </script>
</body>
</html>
